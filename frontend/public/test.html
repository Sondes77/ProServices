<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accueil - TrouveTonPro</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 text-gray-800">
  <!-- HEADER -->
  <header class="bg-white shadow">
    <div class="container mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-xl font-bold text-blue-600">TrouveTonPro</h1>
      <nav class="space-x-4">
        <a href="#" class="text-gray-700 hover:text-blue-600">Accueil</a>
        <a href="#" class="text-gray-700 hover:text-blue-600">À propos</a>
        <a href="#" class="text-gray-700 hover:text-blue-600">Contact</a>
        <a href="#" class="text-gray-700 hover:text-blue-600">Connexion</a>
        <a href="#" class="text-white bg-blue-600 px-3 py-2 rounded hover:bg-blue-700">S'inscrire</a>
      </nav>
    </div>
  </header>

  <!-- HERO / RECHERCHE -->
  <section class="bg-blue-50 py-10">
    <div class="container mx-auto px-4 text-center">
      <h2 class="text-3xl font-semibold mb-4">Trouvez facilement un professionnel près de chez vous</h2>
      <p class="text-gray-600 mb-6">Plombier, menuisier, maçon... Recherchez par ville et région</p>

      <div class="bg-white rounded-lg shadow p-6 max-w-3xl mx-auto">
        <form class="grid grid-cols-1 md:grid-cols-4 gap-4">
          <input type="text" placeholder="Mot-clé (ex: plombier)" class="col-span-1 md:col-span-2 border rounded p-2">

          <select id="ville" class="border rounded p-2" onchange="updateRegions()">
            <option value="">Sélectionnez une ville</option>
            <option value="tunis">Tunis</option>
            <option value="sfax">Sfax</option>
            <option value="sousse">Sousse</option>
          </select>

          <select id="region" class="border rounded p-2">
            <option value="">Région</option>
          </select>

          <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Rechercher</button>
        </form>
      </div>
    </div>
  </section>

  <!-- SCRIPT POUR LES REGIONS DYNAMIQUES -->
  <script>
    const regions = {
      tunis: ["Tunis Centre", "Ariana", "La Marsa"],
      sfax: ["Sfax Ville", "Sakiet Eddaier", "Agareb"],
      sousse: ["Sousse Médina", "Msaken", "Hammam Sousse"]
    };

    function updateRegions() {
      const ville = document.getElementById('ville').value;
      const regionSelect = document.getElementById('region');

      regionSelect.innerHTML = '<option value="">Région</option>';
      if (regions[ville]) {
        regions[ville].forEach(region => {
          const option = document.createElement('option');
          option.value = region;
          option.textContent = region;
          regionSelect.appendChild(option);
        });
      }
    }
  </script>

  <!-- FOOTER -->
  <footer class="bg-white mt-10 py-6 shadow-inner">
    <div class="container mx-auto text-center text-gray-500 text-sm">
      © 2025 TrouveTonPro. Tous droits réservés.
    </div>
  </footer>
</body>

</html>
